name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="/usr/local/lib/android/sdk"
          CMDTOOLS="$SDK_ROOT/cmdline-tools/latest"
          sudo mkdir -p "$CMDTOOLS"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/c.zip
          sudo unzip -q -o /tmp/c.zip -d /tmp/cu
          sudo cp -r /tmp/cu/cmdline-tools/* "$CMDTOOLS"/
          yes | "$CMDTOOLS/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMDTOOLS/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$CMDTOOLS/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: w-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: w-${{ runner.os }}-

      - name: Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/g.zip
            sudo unzip -q -o /tmp/g.zip -d /opt/
            /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
